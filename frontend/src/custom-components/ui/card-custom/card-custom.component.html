<div class="custom-card-container">
  <div class="custom-card-content">
    <span class="custom-card-title">{{ title }}</span>
    <h3 class="custom-card-value">{{ value }}</h3>
    @if (subtext) {
      <p class="custom-card-subtext">{{ subtext }}</p>
    }
  </div>

  <div class="custom-card-badge" [ngClass]="[iconBgClass, iconClass]">
    <ng-content select="[card-icon]"></ng-content>
  </div>
</div>
